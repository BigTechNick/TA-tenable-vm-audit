# TA-tenable-vm-audit
# Search-time CIM mappings for Tenable Vulnerability Management audit log events
# (sourcetype tenable:io:audit_logs, written by the Tenable Add-on for Splunk).
#
# Event fields (JSON): action, crud, is_failure, actor.id, actor.name, target.id,
# target.name, target.type, description, fields{}.key / fields{}.value
# (X-Forwarded-For = client address), received, IO_address.
#
# All EVAL- settings in a stanza read the original field values, so signature keeps
# Tenable's action (user.authenticate.password, user.update, ...) while action is set
# to the CIM value. Event types run after the EVALs and match on signature.
#
# Account change = any user.* action except user.authenticate.* and user.logout.

[tenable:io:audit_logs]
KV_MODE = json

EVAL-signature = action
EVAL-action = case(match(action, "^user\.authenticate\."), if(lower(is_failure)="true", "failure", "success"), match(action, "^user\.(?!authenticate\.|logout$)"), case(crud="c", "created", crud="d", "deleted", true(), "modified"), true(), action)
EVAL-status = if(lower(is_failure)="true", "failure", "success")
EVAL-authentication_method = if(match(action, "^user\.authenticate\."), replace(action, "^user\.authenticate\.", ""), null())
EVAL-change_type = if(match(action, "^user\.(?!authenticate\.|logout$)"), "AAA", null())

# Authentication: user = who signed in. Account changes: user = the account changed,
# src_user = who changed it.
EVAL-user = if(match(action, "^user\.(?!authenticate\.|logout$)"), 'target.name', 'actor.name')
EVAL-src_user = 'actor.name'

# First address in X-Forwarded-For.
EVAL-src = trim(mvindex(split(mvindex('fields{}.value', mvfind('fields{}.key', "^X-Forwarded-For$")), ","), 0))
EVAL-dest = IO_address

EVAL-object = 'target.name'
EVAL-object_id = 'target.id'
EVAL-object_category = lower('target.type')

EVAL-app = "tenable_io"
EVAL-vendor_product = "Tenable Vulnerability Management"
