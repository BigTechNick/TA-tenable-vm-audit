# TA-tenable-vm-audit

[tenable_vm_audit]
search = sourcetype="tenable:io:audit_logs"

# user.authenticate.password, user.authenticate.api_keys, user.authenticate.mfa
[tenable_vm_audit_authentication]
search = sourcetype="tenable:io:audit_logs" signature="user.authenticate.*"

# user.update, user.roles.update, user.2fa_reset, user.create, user.delete, ...
[tenable_vm_audit_account_change]
search = sourcetype="tenable:io:audit_logs" signature="user.*" NOT signature="user.authenticate.*" NOT signature="user.logout"
